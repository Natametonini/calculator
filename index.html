<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Calculator Project</h1>
    <div class="container">

        <h3 id="display">0</h3>
        
        <div class="main-options">
            <div class="numberOptions">
                <button class="numberBtnZero">0</button>
                <button class="numberBtnOne">1</button>
                <button class="numberBtnTwo">2</button>
                <button class="numberBtnThree">3</button>
                <button class="numberBtnFour">4</button>
                <button class="numberBtnFive">5</button>
                <button class="numberBtnSix">6</button>
                <button class="numberBtnSeven">7</button>
                <button class="numberBtnEight">8</button>
                <button class="numberBtnNine">9</button>
            </div>
            
            <div class="operatorOptions">
                <button class="operatorBtnPlus">+</button>
                <button class="operatorBtnMinus">-</button>
                <button class="operatorBtnMult">*</button>
                <button class="operatorBtnDivide">/</button>
                <button class="operatorBtnEquals">=</button>        
            </div>
            
            <button class="clearBtn">Clear</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
